name: Native backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ziglang==0.15.2
      - name: Select the installed native toolchain
        shell: python
        run: |
          import os
          from pathlib import Path
          import ziglang
          executable=Path(ziglang.__file__).parent/('zig.exe' if os.name=='nt' else 'zig')
          assert executable.is_file()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              output.write('GS_NATIVE_CC='+str(executable)+'\n')
              output.write('ZIG_GLOBAL_CACHE_DIR='+str(Path(os.environ['RUNNER_TEMP'])/'gs-zig-global')+'\n')
              output.write('ZIG_LOCAL_CACHE_DIR='+str(Path(os.environ['RUNNER_TEMP'])/'gs-zig-local')+'\n')
      - run: python scripts/ci_command.py python -m unittest discover -s tests -p test_native.py -v
      - run: python scripts/ci_command.py python -m unittest discover -s tests -p test_v06_lsp.py -v
      - name: Validate Win32 SDK ABI and callbacks
        shell: bash
        run: python scripts/ci_command.py python scripts/test_native_win32.py --cc "$GS_NATIVE_CC"
