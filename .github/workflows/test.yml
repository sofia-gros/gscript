name: Compiler tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -m pip install .
      - run: python scripts/ci_command.py python -m unittest discover -s tests -v
      - name: Boot Phaser in Chromium
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/test_phaser_browser.py
      - run: gs examples/hello.gs --format js -o build/hello.js
      - run: node build/hello.js
