name: Release editor plugins
on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editors:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: python scripts/ci_command.py python -m unittest discover -s tests -v
      - run: python scripts/check_plugin_versions.py "${{ github.ref_name }}"
      - run: python scripts/ci_command.py npm ci --prefix editors/vscode
      - run: npm run package --prefix editors/vscode
      - run: node --test editors/vscode/test/server.cjs
      - name: Test installed VSIX with bundled server
        run: python scripts/ci_command.py xvfb-run -a node editors/vscode/test/run.cjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - run: python scripts/ci_command.py cargo build --locked --release --target wasm32-wasip2 --manifest-path editors/zed/Cargo.toml
      - run: cargo test --locked --manifest-path editors/zed/Cargo.toml
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
          actions-cache-folder: emsdk-cache
      - name: Build and test GS highlighting grammar
        run: |
          npm install --prefix "$RUNNER_TEMP/gs-tools" tree-sitter-cli@0.25.10
          export PATH="$RUNNER_TEMP/gs-tools/node_modules/.bin:$PATH"
          python scripts/ci_command.py bash scripts/build_editor_grammar.sh
      - name: Package editor extensions and portable server
        run: |
          cp editors/zed/target/wasm32-wasip2/release/zed_gscript.wasm editors/zed/extension.wasm
          python scripts/build_plugins.py --portable --editors --output plugin-assets
      - uses: actions/upload-artifact@v4
        with:
          name: editors-and-portable-lsp
          path: plugin-assets/*
          if-no-files-found: error
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -p test_lsp.py -v
      - run: python scripts/ci_command.py python -m unittest discover -s tests -p test_v06_lsp.py -v
      - run: python scripts/ci_command.py python scripts/build_plugins.py --native --output plugin-assets
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-${{ matrix.os }}
          path: plugin-assets/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    needs: [editors, native]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: plugin-assets
          merge-multiple: true
      - run: python scripts/check_release_ref.py "${{ github.ref_name }}"
      - run: python scripts/checksums.py plugin-assets
      - name: Publish Plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" plugin-assets/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Plugin v0.6.0"
          --notes-file "docs/releases/$RELEASE_TAG.md"
