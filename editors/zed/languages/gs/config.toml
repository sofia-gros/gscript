name = "GS"
grammar = "gs"
path_suffixes = ["gs", "gos"]
line_comments = ["// "]
block_comment = ["/*", "*/"]
tab_size = 4
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
]
