[package]
name = "gscript-manager"
version = "0.6.2"
edition = "2024"
license = "MIT"
description = "Native GScript compiler, editor and toolchain manager"
build = "build.rs"

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui-component", "dep:rust-embed", "dep:gpui-component-assets"]

[dependencies]
anyhow = "1"
# GPUI 0.2.2 transitively uses xattr 0.2; newer libc removed its ENOATTR alias.
libc = "=0.2.183"
directories = "6"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
regex = "1"
roxmltree = "0.20"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
wait-timeout = "0.2"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", optional = true, features = ["tree-sitter-languages"] }
gpui-component-assets = { version = "=0.5.1", optional = true }
rust-embed = { version = "8", optional = true }

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Environment", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Registry"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
